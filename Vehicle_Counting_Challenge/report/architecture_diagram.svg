<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="800" viewBox="0 0 1400 800">
  <style>
    .title { font: 700 30px Arial; fill: #0f172a; }
    .box { fill: #eff6ff; stroke: #2563eb; stroke-width: 2; rx: 18; }
    .box2 { fill: #ecfeff; stroke: #0891b2; stroke-width: 2; rx: 18; }
    .box3 { fill: #f0fdf4; stroke: #16a34a; stroke-width: 2; rx: 18; }
    .txt { font: 600 18px Arial; fill: #111827; }
    .small { font: 15px Arial; fill: #334155; }
    .arrow { stroke: #475569; stroke-width: 3; marker-end: url(#m); fill: none; }
  </style>
  <defs>
    <marker id="m" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <polygon points="0 0, 10 3, 0 6" fill="#475569" />
    </marker>
  </defs>
  <text x="700" y="50" text-anchor="middle" class="title">AetherEdge Vehicle Counting System Architecture</text>
  <rect x="60" y="120" width="240" height="110" class="box"/>
  <text x="180" y="165" text-anchor="middle" class="txt">Input Video</text>
  <text x="180" y="195" text-anchor="middle" class="small">CCTV MP4 / AVI / MOV / MKV</text>

  <rect x="380" y="120" width="260" height="110" class="box"/>
  <text x="510" y="165" text-anchor="middle" class="txt">YOLO Car Detection</text>
  <text x="510" y="195" text-anchor="middle" class="small">Class filter = car only</text>

  <rect x="720" y="120" width="260" height="110" class="box"/>
  <text x="850" y="165" text-anchor="middle" class="txt">ByteTrack Tracking</text>
  <text x="850" y="195" text-anchor="middle" class="small">Persistent Track IDs</text>

  <rect x="1060" y="120" width="260" height="110" class="box"/>
  <text x="1190" y="165" text-anchor="middle" class="txt">Line Crossing Logic</text>
  <text x="1190" y="195" text-anchor="middle" class="small">Exact-once counting</text>

  <rect x="250" y="360" width="280" height="120" class="box2"/>
  <text x="390" y="405" text-anchor="middle" class="txt">Alert Engine</text>
  <text x="390" y="435" text-anchor="middle" class="small">Crossing + Speed + Threshold alerts</text>

  <rect x="560" y="360" width="280" height="120" class="box2"/>
  <text x="700" y="405" text-anchor="middle" class="txt">Artifact Writer</text>
  <text x="700" y="435" text-anchor="middle" class="small">Annotated video / CSV / JSON / PNG</text>

  <rect x="870" y="360" width="280" height="120" class="box2"/>
  <text x="1010" y="405" text-anchor="middle" class="txt">Session Summary</text>
  <text x="1010" y="435" text-anchor="middle" class="small">Counts / FPS / Duration / Metadata</text>

  <rect x="250" y="610" width="280" height="110" class="box3"/>
  <text x="390" y="655" text-anchor="middle" class="txt">Streamlit Dashboard</text>
  <text x="390" y="685" text-anchor="middle" class="small">Interactive UX for uploads and review</text>

  <rect x="560" y="610" width="280" height="110" class="box3"/>
  <text x="700" y="655" text-anchor="middle" class="txt">FastAPI Service</text>
  <text x="700" y="685" text-anchor="middle" class="small">REST API for automation & integration</text>

  <rect x="870" y="610" width="280" height="110" class="box3"/>
  <text x="1010" y="655" text-anchor="middle" class="txt">Docker Deployment</text>
  <text x="1010" y="685" text-anchor="middle" class="small">Portable reproducible execution</text>

  <path d="M300 175 H380" class="arrow"/>
  <path d="M640 175 H720" class="arrow"/>
  <path d="M980 175 H1060" class="arrow"/>
  <path d="M1190 230 V315 H1010 V360" class="arrow"/>
  <path d="M1190 230 V315 H700 V360" class="arrow"/>
  <path d="M1190 230 V315 H390 V360" class="arrow"/>
  <path d="M390 480 V610" class="arrow"/>
  <path d="M700 480 V610" class="arrow"/>
  <path d="M1010 480 V610" class="arrow"/>
</svg>
